<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/theme.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/base.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/components.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="display:flex; flex-direction:column;">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header" role="banner">
        <div class="header-title" aria-label="Supervisor Dashboard">
            <i class="fas fa-user-shield"></i> 
            <span>Supervisor Dashboard</span>
        </div>
        <nav class="toolbar" aria-label="Header actions">
            <button onclick="logout()" class="btn btn-outline" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </nav>
    </header>

    <main id="main" class="container" role="main">
        <div class="filters-container">
            <div class="filters-header">
                <h3><i class="fas fa-filter"></i> Filters</h3>
                <button id="filters-toggle" class="btn btn-outline"><i class="fas fa-chevron-down"></i></button>
            </div>
            <div id="filters-content" class="filters-content collapsed">
                <input id="searchInput" class="input" type="search" placeholder="Search class/section/division" aria-label="Search">
                <input id="startDate" class="input" type="date" aria-label="Start date">
                <input id="endDate" class="input" type="date" aria-label="End date">
                <button id="exportCsvBtn" class="btn btn-accent" aria-label="Export CSV"><i class="fas fa-file-csv"></i> Export CSV</button>
                <button class="btn btn-primary" onclick="resetAbsences()" aria-label="Reset today's absences"><i class="fas fa-undo"></i> Reset Today</button>
            </div>
        </div>

        <section class="content" aria-label="Data">
            <div class="action-bar">
                <h2 class="page-title">Absence Reports</h2>
                <div class="view-toggle" role="tablist" aria-label="View selector">
                    <button id="viewCards" class="active" role="tab" aria-selected="true">Cards</button>
                    <button id="viewTable" role="tab" aria-selected="false">Table</button>
                </div>
            </div>

            <div class="charts" id="chartsContainer" aria-label="Charts" style="display:none;"></div>

            <div id="loading" class="loading" aria-live="polite" aria-busy="true"><div class="spinner"></div>Loading...</div>

            <div id="cardsView" class="content-cards">
                <div id="absenceList" class="grid-auto"></div>
                <div id="empty-state-container" style="display: none;">
                    <div class="empty-state"><i class="fas fa-bell-slash"></i><p>No active absence reports found for your divisions.</p></div>
                </div>
            </div>

            <div id="tableView" class="content-table hidden">
                <table id="reportsTable">
                    <thead>
                        <tr>
                            <th>Division</th>
                            <th>Class</th>
                            <th>Section</th>
                            <th>Absentees</th>
                            <th>Reported On</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="left-side">
            <img src="../logo 1.png" alt="About Us" class="footer-logo-about" onclick="goAbout()">
            <span> 2025 RHTI. All rights reserved. Made by Ziad</span>
        </div>
        <img src="../logo 2.png" alt="RHTI Logo" class="footer-logo-rhti">
    </footer>

    <script src="../js/supervisor.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/main-supervisor.js"></script>
</body>
</html>
