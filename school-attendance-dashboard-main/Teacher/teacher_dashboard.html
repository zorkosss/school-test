<!DOCTYPE html>
<html lang="en" data-scheme="teacher">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/theme.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/base.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/components.css">
    <link rel="stylesheet" href="/school-attendance-dashboard-main/css/dashboard.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="display:flex; flex-direction:column;">
    <header class="header">
        <div class="header-title"><i class="fas fa-chalkboard-teacher"></i> Teacher Dashboard</div>
        <button onclick="logout()" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </header>

    <main class="container">
        <div class="welcome-card">
            <span>👋 Welcome back, <b id="teacherName">...</b></span>
            <span>Today's Date: <b id="currentDate">...</b></span>
        </div>

        <form onsubmit="event.preventDefault(); submitAbsence();">
            <div class="layout-teacher">
                <div class="col-left">
                    <div class="form-container">
                        <h3><i class="fas fa-clipboard-list"></i> Submit Daily Absence Report</h3>
                        <div class="form-group">
                            <label for="absentList">Absent Students (comma-separated):</label>
                            <textarea id="absentList" placeholder="Alice Smith, Bob Johnson..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Submit Absence</button>
                    </div>
                </div>
                <div class="col-right">
                    <div class="form-container">
                        <h3><i class="fas fa-sliders-h"></i> Select Class</h3>
                        <div class="form-group">
                            <label for="division">Select Division:</label>
                            <select id="division">
                                <option value="" disabled selected>-- Loading Divisions --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="className">Class Name:</label>
                            <select id="className" disabled>
                                <option value="">-- First Select a Division --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="section">Section:</label>
                            <select id="section" disabled>
                                <option value="">-- First Select a Class --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="left-side">
            <img src="../logo 1.png" alt="About Us" class="footer-logo-about" onclick="goAbout()">
            <span>© 2025 RHTI. All rights reserved. Made by Ziad</span>
        </div>
        <img src="../logo 2.png" alt="RHTI Logo" class="footer-logo-rhti">
    </footer>

    <script src="../js/teacher.js"></script>
</body>
</html>
